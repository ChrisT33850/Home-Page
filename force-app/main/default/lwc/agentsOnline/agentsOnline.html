<template>
    <div class="slds-page-header slds-page-header_record-home">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <span class="slds-icon_container slds-icon-standard-user">
                            <svg class="slds-icon slds-page-header__icon" aria-hidden="true">
                                <use xlink:href="/assets/icons/standard/user_60.svg#user"></use>
                            </svg>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title slds-truncate">
                            <span class="slds-page-header__title-label">Agents En Ligne</span>
                        </h1>
                        <p class="slds-page-header__title-meta">Statut de présence Omnichannel</p>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <lightning-button 
                            label="Rafraîchir" 
                            title="Actualiser les statuts"
                            onclick={handleRefresh}
                            icon-name="utility:refresh"
                            variant="border">
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template if:true={hasError}>
        <lightning-card title="Erreur">
            <div class="slds-notify slds-notify_alert slds-alert_error">
                <span class="slds-assistive-text">Erreur</span>
                {errorMessage}
            </div>
        </lightning-card>
    </template>

    <template if:true={isLoading}>
        <div class="slds-align_absolute-center" style="padding: 40px;">
            <lightning-spinner alternative-text="Chargement..." size="large"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="slds-page-header_container">
            
            <section class="slds-section slds-is-open slds-m-top_medium">
                <h2 class="slds-section__title">
                    <span class="slds-truncate">📂 Sélectionner une Queue</span>
                </h2>
                <div class="slds-section__content slds-p-top_small">
                    <template if:true={hasQueues}>
                        <div class="slds-form-element slds-m_bottom_medium">
                            <label class="slds-form-element__label" for="queue-select">
                                <abbr class="slds-required" title="required">*</abbr> Queues disponibles
                            </label>
                            <div class="slds-form-element__control">
                                <div class="slds-select_container">
                                    <select 
                                        id="queue-select" 
                                        class="slds-select"
                                        onchange={handleQueueChange}>
                                        <template for:each={queueOptions} for:item="queue">
                                            <option key={queue.value} value={queue.value}>
                                                {queue.label}
                                            </option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

            <section class="slds-section slds-is-open slds-m-top_medium">
                <h2 class="slds-section__title">
                    <span class="slds-truncate">👥 Agents de la Queue</span>
                </h2>
                <div class="slds-section__content slds-p-top_small">
                    
                    <template if:true={agentsInQueue.length}>
                        <div class="agents-container">
                            <template for:each={agentsInQueue} for:item="agent">
                                <div key={agent.userId} class="agent-card">
                                    <div class="agent-avatar">
                                        <lightning-avatar
                                            src={agent.photoUrl}
                                            initials={agent.initials}
                                            size="large"
                                            variant="circle"
                                            alt={agent.name}>
                                        </lightning-avatar>
                                        
                                        <div 
                                            class="status-indicator"
                                            style={getAgentPresence(agent.userId).statusColor}
                                            title={getAgentPresence(agent.userId).statusName}>
                                        </div>
                                    </div>
                                    
                                    <div class="agent-info">
                                        <div class="agent-name">{agent.name}</div>
                                        <div class="agent-status">
                                            {getAgentPresence(agent.userId).statusName}
                                        </div>
                                    </div>
                                    
                                    <div class="agent-actions">
                                        <span class="status-icon">
                                            {getStatusIcon(getAgentPresence(agent.userId).statusName)}
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="agents-stats slds-m-top_large">
                            <div class="stat-card stat-available">
                                <div class="stat-value">{agentStats.available}</div>
                                <div class="stat-label">Disponibles</div>
                            </div>
                            <div class="stat-card stat-busy">
                                <div class="stat-value">{agentStats.busy}</div>
                                <div class="stat-label">En cours</div>
                            </div>
                            <div class="stat-card stat-offline">
                                <div class="stat-value">{agentStats.offline}</div>
                                <div class="stat-label">Hors ligne</div>
                            </div>
                        </div>
                    </template>

                    <template if:false={agentsInQueue.length}>
                        <div class="slds-align_absolute-center slds-p-top_medium slds-p_bottom_medium">
                            <div class="slds-text_color_weak">
                                <p class="slds-text-heading_medium">Aucun agent</p>
                                <p>Sélectionne une queue pour voir les agents</p>
                            </div>
                        </div>
                    </template>

                </div>
            </section>

            <section class="slds-section slds-is-open slds-m-top_medium">
                <h2 class="slds-section__title">
                    <span class="slds-truncate">📋 Légende des Statuts</span>
                </h2>
                <div class="slds-section__content slds-p-top_small">
                    <div class="legend-container">
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #04844b;"></span>
                            <span class="legend-label">Disponible - Prêt à prendre des appels</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #ff9f1c;"></span>
                            <span class="legend-label">Occupé - En conversation</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #9c89b8;"></span>
                            <span class="legend-label">Pause - Pause forcée</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #0070d2;"></span>
                            <span class="legend-label">En appel - En conversation active</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #ea001e;"></span>
                            <span class="legend-label">Absent - Loin du bureau</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-indicator" style="background-color: #888;"></span>
                            <span class="legend-label">Hors ligne - Déconnecté</span>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </template>
</template>
