<template>
    <div class="slds-page-header slds-page-header_record-home">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <span class="slds-icon_container slds-icon-standard-case">
                            <svg class="slds-icon slds-page-header__icon" aria-hidden="true">
                                <use xlink:href="/assets/icons/standard/case_60.svg#case"></use>
                            </svg>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title slds-truncate">
                            <span class="slds-page-header__title-label">Tableau de Bord Kanban</span>
                        </h1>
                        <p class="slds-page-header__title-meta">Gérez vos cases en temps réel</p>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <lightning-button 
                            label="Rafraîchir" 
                            title="Actualiser les données"
                            onclick={handleRefresh}
                            icon-name="utility:refresh"
                            variant="border">
                        </lightning-button>
                    </div>
                    <div class="slds-page-header__control">
                        <lightning-button 
                            label="Nouveau Cas" 
                            title="Créer un nouveau cas"
                            onclick={handleNewCase}
                            icon-name="utility:add"
                            variant="brand">
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template if:true={hasError}>
        <lightning-card title="Erreur">
            <div class="slds-notify slds-notify_alert slds-alert_error">
                <span class="slds-assistive-text">Erreur</span>
                {errorMessage}
            </div>
        </lightning-card>
    </template>

    <template if:true={isLoading}>
        <div class="slds-align_absolute-center" style="padding: 40px;">
            <lightning-spinner alternative-text="Chargement..." size="large"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <div class="slds-page-header_container">
            
            <section class="slds-section slds-is-open slds-m-top_medium">
                <h2 class="slds-section__title">
                    <span class="slds-truncate">📂 Mes Files d'Attente</span>
                </h2>
                <div class="slds-section__content slds-p-top_small">
                    <template if:true={hasQueues}>
                        <div class="queues-container">
                            <template for:each={queuesWithCount} for:item="queue">
                                <div 
                                    key={queue.queueId} 
                                    class="queue-card"
                                    data-queue-id={queue.queueId}
                                    onclick={handleViewQueue}>
                                    <div class="queue-name">{queue.queueName}</div>
                                    <div class="queue-count">{queue.caseCount}</div>
                                    <div class="queue-label">en attente</div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </section>

            <section class="slds-section slds-is-open slds-m-top_medium">
                <h2 class="slds-section__title">
                    <span class="slds-truncate">🎯 Kanban - Tous les Cas</span>
                </h2>
                
                <template if:true={hasQueues}>
                    <div class="slds-form-element slds-m_top_medium slds-m_bottom_medium">
                        <label class="slds-form-element__label" for="queue-select">
                            <abbr class="slds-required" title="required">*</abbr> Filtrer par Queue
                        </label>
                        <div class="slds-form-element__control">
                            <div class="slds-select_container">
                                <select 
                                    id="queue-select" 
                                    class="slds-select"
                                    onchange={handleQueueChange}>
                                    <template for:each={queueOptions} for:item="queue">
                                        <option key={queue.value} value={queue.value}>
                                            {queue.label}
                                        </option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:true={hasCases}>
                    <div class="kanban-board">
                        <template for:each={kanbanStatuses} for:item="status">
                            <div 
                                key={status}
                                class="kanban-column"
                                data-status={status}
                                ondragover={handleDragOver}
                                ondrop={handleDrop}>
                                
                                <div class="kanban-column-header">
                                    <span class="kanban-status-icon">{getStatusIcon(status)}</span>
                                    <span class="kanban-status-name">{status}</span>
                                    <span class="kanban-count">{getCaseCountForStatus(status)}</span>
                                </div>
                                
                                <div class="kanban-cards">
                                    <template for:each={getCasesForStatus(status)} for:item="caseItem">
                                        <div 
                                            key={caseItem.Id}
                                            class="kanban-card"
                                            data-case-id={caseItem.Id}
                                            data-status={status}
                                            draggable="true"
                                            ondragstart={handleDragStart}
                                            ondragend={handleDragEnd}>
                                            
                                            <div class="card-header">
                                                <span class="case-number">{caseItem.CaseNumber}</span>
                                                <span class="card-priority" data-priority={caseItem.Priority}>
                                                    {caseItem.Priority}
                                                </span>
                                            </div>
                                            
                                            <div class="card-subject">{caseItem.Subject}</div>
                                            
                                            <div class="card-footer">
                                                <span class="card-account">{caseItem.Account.Name}</span>
                                                <span class="card-date">{caseItem.CreatedDate}</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasCases}>
                    <div class="slds-align_absolute-center slds-p-top_medium slds-p_bottom_medium">
                        <div class="slds-text_color_weak">
                            <p
